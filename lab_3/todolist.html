<!DOCTYPE html>
<html>
    <head>
        <title>ToDo List</title>
        <style>
            .ToDoList{
                height: 50px;
                background-color: black;
            }
            .p1{
                color: gray;
                font-family: arial;
                font-size: 20px;
                padding-top: 0.4cm;
                padding-left: 2cm;
            }
            p{
                font-family: arial;
                font-size: 30px;
                padding-left: 9cm;
            }
            #taskInput{
                width: 600px;
                height: 30px;
                border:1px solid rgb(211, 211, 211);
                border-radius: 5px;
                font-size: 18px;
            }
            .input-section{
                padding-left: 10cm;
            }
            #addBtn{
                height: 30px;
                width: 50px;
                background-color: rgb(0, 85, 221);
                color: white;
                border: 1px solid rgb(211, 211, 211);
                border-radius: 5px;
                font-size: 15px;
            }
            .todo-list {
                padding-left: 9cm; 
                margin-top: 20px;
                /* list-style: none; */
            }
            
            .todo-item {
                display: flex;
                align-items: center;
                gap: 12px;
                width: 650px; 
                padding: 12px 15px;
                margin-bottom: 10px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                background-color: white;
            }
            
            
            .todo-item button {
                background-color: transparent;
                border: none;
                width: 30px;
                height: 30px;
                background-image: url('https://png.pngtree.com/png-clipart/20240513/original/pngtree-rounded-raster-icon-of-a-red-and-white-flat-trash-can-png-image_15081599.png');
                background-size: contain;
            }
            
            .todo-item.completed span {
                text-decoration: line-through;
                color: gray;
            }
        </style>
    </head>
    <body>
        <div class="ToDoList"> <p class="p1">ToDo List</p> </div>
        <div class="content">
            <p>ToDo List</p>
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="New Task">
                <button id="addBtn">Add</button>
            </div>
            <ul class="todo-list" id="todoList"></ul>
        </div>
        
        <script>
            const taskInput = document.getElementById('taskInput');
            const addBtn = document.getElementById('addBtn');
            const todoList = document.getElementById('todoList');
                
            function createTaskItem(text, isCompleted = false) {
                const li = document.createElement('li');
                li.className = 'todo-item' + (isCompleted ? ' completed' : '');
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.style.width = '18px';
                checkbox.style.height = '18px';
                checkbox.style.cursor = 'pointer';
                checkbox.checked = isCompleted;
                
                const span = document.createElement('span');
                span.textContent = text;
                span.style.fontSize = '18px';
                span.style.fontFamily = 'arial';
                span.style.flex = '1';
                
                const deleteBtn = document.createElement('button');
                
                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(deleteBtn);
                
                checkbox.addEventListener('change', function() {
                    if (this.checked) {
                        li.classList.add('completed');
                    } else {
                        li.classList.remove('completed');
                    }
                });
                
                deleteBtn.addEventListener('click', function() {
                    li.remove();
                });
                
                return li;
            }

            function addTask() {
                const taskText = taskInput.value.trim();
                if (taskText === '') {
                    alert('Please, enter a task');
                    return;
                }
                const taskItem = createTaskItem(taskText, false);
                
                todoList.appendChild(taskItem);
                taskInput.value = '';
                taskInput.focus();
            }

            addBtn.addEventListener('click', addTask);

            taskInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    addTask();
                }
            });

            const initialTasks = [
                { text: 'First item', completed: true },
                { text: 'Second item', completed: false },
                { text: 'Third item', completed: false }
            ];

            initialTasks.forEach(task => {
                const taskItem = createTaskItem(task.text, task.completed);
                todoList.appendChild(taskItem);
            });
        </script>
    </body>
</html>
